<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14251d"><meta name="description" content="I M SHOP — অনলাইন শপ">
<title>I M SHOP — অনলাইন দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:'Hind Siliguri',sans-serif;color:#17251e;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#14251d;color:white;padding:18px max(16px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:25px;font-weight:700}.tag{font-size:12px;color:#d5e1d8}.cartbtn,.buy{border:0;border-radius:10px;padding:10px 15px;background:#e9b85c;color:#18251e;font-weight:700}.hero{max-width:1120px;margin:22px auto;padding:28px 22px;border-radius:18px;background:linear-gradient(120deg,#e2eee4,#f8ead2)}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#53665a}.wrap{max-width:1120px;margin:20px auto;padding:0 14px}.filters{display:flex;gap:8px;overflow:auto;padding:8px 0 15px}.filter{white-space:nowrap;border:1px solid #d7e0d8;background:white;border-radius:20px;padding:8px 15px}.filter.active{background:#183a2a;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.product{background:white;border:1px solid #e4eae4;border-radius:14px;overflow:hidden}.product img{width:100%;height:190px;object-fit:cover;background:#eef2ee}.pbody{padding:12px}.pbody h3{font-size:16px;margin:0 0 5px}.desc{font-size:12px;color:#718075;min-height:32px}.price{font-weight:700;font-size:18px;margin:8px 0}.stock{font-size:11px;color:#688071}.add{width:100%;border:0;background:#173b2b;color:white;border-radius:9px;padding:9px;margin-top:8px}.add:disabled{opacity:.45}.empty,.notice{padding:25px;text-align:center;color:#68766d;background:white;border-radius:12px}.drawer{position:fixed;inset:0;background:#0007;display:none;z-index:4;justify-content:flex-end}.drawer.open{display:flex}.panel{background:white;width:min(100%,480px);height:100%;overflow:auto;padding:18px}.panelhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#edf1ed;border-radius:9px;padding:8px 12px}.cartrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e8eee8;padding:12px 0}.qty{display:flex;gap:8px;align-items:center}.qty button{border:0;border-radius:6px;padding:3px 9px}.total{font-weight:700;font-size:19px;margin:15px 0}.form label{display:block;font-size:13px;font-weight:600;margin:10px 0}.form input,.form textarea,.form select{display:block;width:100%;padding:11px;border:1px solid #d8e0d8;border-radius:9px;margin-top:5px}.submit{width:100%;background:#173b2b;color:white;border:0;border-radius:10px;padding:13px;font-weight:700}.muted{font-size:12px;color:#758177}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14251d;color:white;padding:10px 16px;border-radius:9px;display:none;z-index:8}
@media(max-width:600px){.hero{margin:12px 12px;padding:22px 17px}.hero h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product img{height:155px}.pbody{padding:9px}.pbody h3{font-size:14px}.top{padding:13px 14px}.brand{font-size:21px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">I M SHOP</div><div class="tag">আপনার পছন্দের অনলাইন দোকান</div></div><button class="cartbtn" id="openCart">কার্ট <span id="cartCount">0</span></button></header>
<section class="hero"><h1>স্বাগতম I M SHOP-এ</h1><p>পছন্দের পণ্য দেখুন, কার্টে যোগ করুন এবং সহজে অর্ডার করুন।</p></section>
<main class="wrap"><div id="status" class="notice">পণ্য লোড হচ্ছে…</div><nav id="filters" class="filters"></nav><section id="products" class="grid"></section></main>
<div class="drawer" id="drawer"><div class="panel"><div class="panelhead"><h2>আপনার কার্ট ও Checkout</h2><button class="close" id="closeCart">বন্ধ</button></div><div id="cartItems"></div><div class="total" id="totals">মোট: ৳০</div><form id="checkout" class="form">
<label>আপনার নাম *<input name="name" required maxlength="100"></label>
<label>মোবাইল নম্বর *<input name="phone" required inputmode="tel" maxlength="20"></label>
<label>জেলা *<input name="district" required placeholder="যেমন: ঢাকা"></label>
<label>থানা *<input name="thana" required></label>
<label>ডেলিভারি এলাকা<input name="area" placeholder="এলাকা/ইউনিয়ন"></label>
<label>সম্পূর্ণ ঠিকানা *<textarea name="address" required rows="3"></textarea></label>
<label>অতিরিক্ত তথ্য<textarea name="notes" rows="2"></textarea></label>
<p class="muted">পেমেন্ট: ক্যাশ অন ডেলিভারি। ঢাকা ডেলিভারি ৳৭০, ঢাকার বাইরে ৳১৩০।</p>
<button class="submit" id="submitOrder" type="submit">অর্ডার কনফার্ম করুন</button><p id="checkoutMsg" class="muted"></p></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://ubkultowuzonvkdqqihd.supabase.co";
const SB_KEY="sb_publishable_PLhvJW8yWedj4K6rsl0ctA_1_8BPUI5";
const db=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id), money=n=>"৳"+Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products=[],categories=[],variants=[],cart=[],activeCat="all";
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
async function load(){
 try{
  const [p,c,v,im]=await Promise.all([
   db.from("products").select("id,name,description,price,stock_quantity,image_url,category_id").eq("is_active",true).order("created_at",{ascending:false}),
   db.from("categories").select("id,name").eq("is_active",true).order("sort_order"),
   db.from("product_variants").select("id,product_id,size,color,price,stock_quantity").eq("is_active",true),
   db.from("product_images").select("product_id,image_url,sort_order").order("sort_order")
  ]);
  if(p.error)throw p.error;if(c.error)throw c.error;
  products=p.data||[];categories=c.data||[];variants=v.error?[]:(v.data||[]);
  const images=im.error?[]:(im.data||[]);
  products.forEach(x=>{x.gallery=images.filter(i=>i.product_id===x.id);});
  $("status").style.display=products.length?"none":"block";$("status").textContent=products.length?"":"এখনো কোনো সক্রিয় পণ্য প্রকাশ করা হয়নি।";
  renderFilters();renderProducts();
 }catch(e){$("status").textContent="দোকানের পণ্য লোড করা যায়নি: "+e.message;}
}
function renderFilters(){
 $("filters").innerHTML='<button class="filter '+(activeCat==="all"?"active":"")+'" data-cat="all">সব পণ্য</button>'+categories.map(c=>'<button class="filter '+(activeCat===c.id?"active":"")+'" data-cat="'+c.id+'">'+esc(c.name)+'</button>').join("");
 $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderFilters();renderProducts();});
}
function renderProducts(){
 const list=products.filter(p=>activeCat==="all"||p.category_id===activeCat);
 $("products").innerHTML=list.length?list.map(p=>{
  const opts=variants.filter(v=>v.product_id===p.id);
  const img=p.image_url||p.gallery?.[0]?.image_url||"";
  return '<article class="product"><img src="'+esc(img)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'"><div class="pbody"><h3>'+esc(p.name)+'</h3><div class="desc">'+esc(p.description||"")+'</div><div class="price">'+money(p.price)+'</div><div class="stock">'+(p.stock_quantity>0?"স্টক আছে":"স্টক শেষ")+'</div>'+(opts.length?'<select id="variant-'+p.id+'" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;margin-top:6px"><option value="">সাইজ/ভ্যারিয়েন্ট বাছুন</option>'+opts.map(v=>'<option value="'+v.id+'" '+(v.stock_quantity<1?"disabled":"")+'>'+esc([v.size,v.color].filter(Boolean).join(" / ")||"ভ্যারিয়েন্ট")+' — '+money(v.price??p.price)+' ('+v.stock_quantity+')</option>').join("")+'</select>':'')+'<button class="add" data-add="'+p.id+'" '+(p.stock_quantity<1&&!opts.length?"disabled":"")+'>'+(p.stock_quantity<1&&!opts.length?"স্টক শেষ":"কার্টে যোগ করুন")+'</button></div></article>';
 }).join(""):'<div class="empty">এই ক্যাটাগরিতে এখন কোনো পণ্য নেই।</div>';
 $("products").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addCart(b.dataset.add));
}
function addCart(id){
 const p=products.find(x=>x.id===id),opts=variants.filter(v=>v.product_id===id);
 const variantId=opts.length?$("variant-"+id)?.value:null;
 if(opts.length&&!variantId){toast("আগে সাইজ/ভ্যারিয়েন্ট নির্বাচন করুন");return;}
 const v=variantId?opts.find(x=>x.id===variantId):null,stock=v?v.stock_quantity:p.stock_quantity;
 const key=id+":"+(variantId||"");let item=cart.find(x=>x.key===key);
 if(item){if(item.qty>=stock){toast("স্টকের বেশি যোগ করা যাবে না");return;}item.qty++;}
 else cart.push({key,product_id:id,variant_id:variantId||null,name:p.name,variant:v?[v.size,v.color].filter(Boolean).join(" / "):"",price:Number(v?.price??p.price),qty:1,stock});
 renderCart();toast("কার্টে যোগ হয়েছে");
}
function renderCart(){
 $("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
 $("cartItems").innerHTML=cart.length?cart.map(x=>'<div class="cartrow"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.variant)+' · '+money(x.price)+'</div><div class="qty"><button data-q="'+x.key+'" data-d="-1">−</button>'+x.qty+'<button data-q="'+x.key+'" data-d="1">+</button><button data-remove="'+x.key+'">বাদ</button></div></div><b>'+money(x.price*x.qty)+'</b></div>').join(""):'<div class="empty">কার্ট খালি। আগে পণ্য যোগ করুন।</div>';
 const sub=cart.reduce((s,x)=>s+x.price*x.qty,0);$("totals").textContent="পণ্যের মূল্য: "+money(sub)+" · ডেলিভারি ঠিকানা দেওয়ার পর হিসাব নিশ্চিত হবে";
 $("cartItems").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const x=cart.find(i=>i.key===b.dataset.q);if(!x)return;const q=x.qty+Number(b.dataset.d);if(q<1)return; if(q>x.stock){toast("স্টকের বেশি অর্ডার করা যাবে না");return;}x.qty=q;renderCart();});
 $("cartItems").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.key!==b.dataset.remove);renderCart();});
}
$("openCart").onclick=()=>{$("drawer").classList.add("open");renderCart()};$("closeCart").onclick=()=>$("drawer").classList.remove("open");
$("checkout").onsubmit=async e=>{
 e.preventDefault();if(!cart.length){toast("কার্ট খালি");return;}
 const f=new FormData(e.currentTarget),district=String(f.get("district")).trim();
 const btn=$("submitOrder");btn.disabled=true;btn.textContent="অর্ডার পাঠানো হচ্ছে…";$("checkoutMsg").textContent="";
 try{
  const items=cart.map(x=>({product_id:x.product_id,variant_id:x.variant_id,quantity:x.qty}));
  const {data,error}=await db.rpc("create_public_order",{p_customer_name:String(f.get("name")).trim(),p_customer_phone:String(f.get("phone")).trim(),p_district:district,p_thana:String(f.get("thana")).trim(),p_address:String(f.get("address")).trim(),p_delivery_area:String(f.get("area")||"").trim(),p_items:items,p_notes:String(f.get("notes")||"").trim()});
  if(error)throw error;
  cart=[];renderCart();$("checkoutMsg").textContent="অর্ডার সফল! আপনার অর্ডার নম্বর: "+data.order_number+" | মোট: "+money(data.total);
  $("checkout").reset();toast("অর্ডার সফলভাবে গ্রহণ করা হয়েছে");
 }catch(err){$("checkoutMsg").textContent="অর্ডার করা যায়নি: "+err.message;}
 finally{btn.disabled=false;btn.textContent="অর্ডার কনফার্ম করুন";}
};
load();
</script>
</body></html>
