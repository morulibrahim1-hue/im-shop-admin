name: Build I M SHOP Admin Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'modules.js'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp index.html styles.css app.js modules.js config.js manifest.webmanifest icon.svg www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.imshop.admin",
            "appName": "I M SHOP Admin",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: im-shop-admin-updated-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
