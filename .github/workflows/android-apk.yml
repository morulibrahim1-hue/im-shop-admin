name: Build I M SHOP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'config.js'
      - 'icon.svg'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android app
        run: |
          mkdir -p www/assets
          cp index.html styles.css app.js config.js www/
          cp icon.svg www/assets/icon.svg
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "I M SHOP Admin" "com.imshop.admin" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: im-shop-admin-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
