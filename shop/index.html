<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="I M SHOP — অনলাইন শপিং"><title>I M SHOP — Online Shop</title><link rel="stylesheet" href="style.css"></head>
<body><button id="imGlobalBack" type="button" aria-label="আগের পৃষ্ঠায় ফিরে যান">← ফিরে যান</button><header class="top"><a class="brand" href="./"><span>IM</span><b>I M SHOP</b></a><span class="cart-link">সহজ অর্ডার • ক্যাশ অন ডেলিভারি</span></header>
<section class="hero"><p>WELCOME TO I M SHOP</p><h1>আপনার পছন্দের কেনাকাটা<br>এখন আরও সহজ</h1><span>নতুন কালেকশন দেখুন</span></section>
<main><div class="heading"><div><small>OUR COLLECTION</small><h2>সব পণ্য</h2></div><input id="search" type="search" placeholder="পণ্য খুঁজুন…"></div><div id="categories" class="categories"><button class="selected" data-category="all">সব</button></div><div id="products" class="products"><p class="notice">পণ্য লোড হচ্ছে…</p></div></main>
<div class="drawer" id="orderDrawer" aria-hidden="true"><section class="order-panel"><div class="order-head"><div><small>I M SHOP</small><h2>অর্ডার নিশ্চিত করুন</h2></div><button type="button" id="closeOrder" class="close">বন্ধ</button></div><div id="orderProduct" class="order-product"></div>
<form id="checkout" class="checkout"><label>আপনার নাম *<input name="name" required maxlength="100" autocomplete="name"></label><label>মোবাইল নম্বর *<input name="phone" required inputmode="tel" maxlength="20" autocomplete="tel"></label><label>আপনার ঠিকানা কোথায়? *<select name="delivery_zone" required><option value="">নির্বাচন করুন</option><option value="ঢাকার ভিতরে">ঢাকার ভিতরে</option><option value="ঢাকার বাইরে">ঢাকার বাইরে</option></select></label><label>জেলা *<input name="district" required placeholder="আপনার জেলার নাম লিখুন" autocomplete="address-level1"></label><label>থানা *<input name="thana" required autocomplete="address-level2"></label><label>ডেলিভারি এলাকা<input name="area" placeholder="এলাকা/ইউনিয়ন"></label><label>সম্পূর্ণ ঠিকানা *<textarea name="address" required rows="3" autocomplete="street-address"></textarea></label><label id="checkoutVariantField" hidden>সাইজ / কালার *<select id="checkoutVariant" name="variant_id"><option value="">সাইজ/কালার বাছুন</option></select></label><label>পরিমাণ *<input name="quantity" type="number" min="1" max="20" value="1" required></label><label>অতিরিক্ত তথ্য<textarea name="notes" rows="2"></textarea></label><p class="delivery-note">পেমেন্ট: ক্যাশ অন ডেলিভারি। ঢাকা ৳৭০, ঢাকার বাইরে ৳১৩০। চূড়ান্ত ডেলিভারি চার্জ সার্ভার থেকে হিসাব হবে।</p><button id="submitOrder" class="submit" type="submit">অর্ডার কনফার্ম করুন</button><p id="checkoutMsg" class="form-message" aria-live="polite"></p></form></section></div><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="app.js"></script></body></html>
